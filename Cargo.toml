[package]
name = "elecrust-bindgen"
version = "0.0.1"
edition = "2024"
description = "A bindgen for Elecrust"
license = "MIT"
repository = "https://github.com/houxd/elecrust-bindgen"
homepage = "https://github.com/houxd/elecrust-bindgen"
